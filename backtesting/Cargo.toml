[package]
name = "backtesting"
version = "0.1.0"
edition = "2024"

[lib]
name = "backtesting"
path = "src/lib.rs"

[[bin]]
name = "backtesting"
path = "src/main.rs"

[dependencies]
chrono = {version = "0.4.45", features = ["serde"]}
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
