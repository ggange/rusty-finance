[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "backtesting-py"
version = "0.1.0"
requires-python = ">=3.9"
description = "Python bindings for the rusty-finance backtesting engine"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "backtesting_py"
