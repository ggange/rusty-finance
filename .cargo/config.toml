# Allow PyO3 extension-module cdylib to link against Python symbols at runtime
# (resolved when the .so is loaded by the Python interpreter, not at link time)
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
