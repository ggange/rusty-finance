[project]
name = "rusty-finance-api"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.19",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "pytest-asyncio", "yfinance>=0.2.40"]

[tool.pytest.ini_options]
pythonpath = [".."]
